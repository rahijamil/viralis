version: '3.8'

services:
  # --- Databases & Middleware ---
  postgres:
    image: postgres:15-alpine
    container_name: viralis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viralis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viralis_pass}
      POSTGRES_DB: ${POSTGRES_DB:-viralis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: viralis-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: viralis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Kafka Setup (KRaft mode for simplicity in Dev)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: viralis-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- Migration Service ---
  migration:
    image: amacneil/dbmate:latest
    container_name: viralis-migration
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/postgres/migrations:/migrations
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-viralis}:${POSTGRES_PASSWORD:-viralis_pass}@postgres:5432/${POSTGRES_DB:-viralis}?sslmode=disable
    command: -d "/migrations" up

  # --- Application Services ---
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: viralis-ingestion
    ports:
      - "8080:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-viralis}:${POSTGRES_PASSWORD:-viralis_pass}@postgres:5432/${POSTGRES_DB:-viralis}
      - KAFKA_BROKERS=kafka:29092
      - REDIS_URL=redis://redis:6379
      - PORT=8080

  crawler:
    build:
      context: ./services/crawler
      dockerfile: Dockerfile
    container_name: viralis-crawler
    ports:
      - "8081:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:29092
      - PORT=8080

  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: viralis-analytics
    ports:
      - "8082:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:29092
      - QDRANT_URL=http://qdrant:6333
      - PORT=8080

  alert:
    build:
      context: ./services/alert
      dockerfile: Dockerfile
    container_name: viralis-alert
    ports:
      - "8083:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:29092
      - REDIS_URL=redis://redis:6379
      - PORT=8080

  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    container_name: viralis-user
    ports:
      - "8084:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-viralis}:${POSTGRES_PASSWORD:-viralis_pass}@postgres:5432/${POSTGRES_DB:-viralis}
      - REDIS_URL=redis://redis:6379
      - PORT=8080

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: viralis-dashboard
    ports:
      - "8085:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      - PORT=8080

  ingestion-go:
    build:
      context: ./services/ingestion-go
      dockerfile: Dockerfile
    container_name: viralis-ingestion-go
    ports:
      - "8086:8080"
    depends_on:
      kafka:
        condition: service_healthy

  seeder:
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile.seeder
    container_name: viralis-seeder
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER:-viralis}
      - DB_PASS=${POSTGRES_PASSWORD:-viralis_pass}
      - DB_NAME=${POSTGRES_DB:-viralis}
    restart: on-failure

volumes:
  postgres_data:
  qdrant_data:
