apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-go-service
  namespace: production
  labels:
    app: ingestion-go-service
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ingestion-go-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ingestion-go-service
    spec:
      containers:
        - name: ingestion-go-service
          image: rahijamil/viralis-ingestion-go:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          env:
            - name: ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-go-service
  namespace: production
spec:
  selector:
    app: ingestion-go-service
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestion-go-service-pdb
  namespace: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ingestion-go-service
