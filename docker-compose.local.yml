services:
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  crawler:
    build:
      context: ./services/crawler
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080

  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - PORT=8080

  alert:
    build:
      context: ./services/alert
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      - PORT=8080

  user:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      - PORT=8080

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    environment:
      - PORT=8080

  ingestion-go:
    build:
      context: ./services/ingestion-go
      dockerfile: Dockerfile
    ports:
      - "8086:8080"
